name: Daily Pan-India Entry-Level Job Scout

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST (Asia/Kolkata)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scout-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Daily Scout
        run: node run-daily-scout.js

      - name: Prepare GitHub Pages Artifact
        run: |
          mkdir -p public
          cp output/dashboard.html public/index.html
          if [ -d "output/cover_letters" ]; then
            cp -r output/cover_letters public/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate GitHub Actions Job Summary
        if: always()
        run: |
          echo "## 🚀 Daily Pan-India Entry-Level Job Scout Summary" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at **$(date)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "View and apply on your phone/browser: [Open Live Dashboard](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'job-scout' }}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Application Database Status" >> $GITHUB_STEP_SUMMARY
          echo "- Filter: **0-1 Year Full-Time Entry Level (No Internships • No Data Science • Strict 24h Window)**" >> $GITHUB_STEP_SUMMARY
          echo "- Scope: **Pan-India (Bengaluru, Hyderabad, Pune, Delhi-NCR, Remote - Excluded Mumbai)**" >> $GITHUB_STEP_SUMMARY
          echo "- Target: **Tier 1 to Tier 3 Employers**" >> $GITHUB_STEP_SUMMARY

      - name: Commit & Push Updated Tracker Database
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main || true
          git add applications.json output/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update daily job applications [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Push warning: continuing without push"
          fi
